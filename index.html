<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Butterfly Keyboard — v6</title>
  <meta name="description" content="Twenty-six butterflies are a keyboard. Reach, pinch, spell your name.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    body { margin: 0; background: #ffffff; }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- the wing generator, unchanged from v2 (parity with TouchDesigner) -->
  <script src="js/rolltable.js"></script>
  <script src="js/wing-gen.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/wing-tex.js"></script>

  <!-- v7: 2D noise fields for the born butterfly's painted wing.
       noise.js is standalone; wing-paint.js needs it, CFG and WingGen. -->
  <script src="js/noise.js"></script>

  <!-- the piece -->
  <script src="js/config.js"></script>
  <script src="js/wing-paint.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/style.js"></script>
  <script src="js/bfly-model.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hands.js"></script>
  <script src="js/keyboard.js"></script>
  <!-- born.js AFTER keyboard.js: it reuses that file's module-scope
       makeFbm / smoothstep / rand / UP rather than duplicating them. -->
  <script src="js/born.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- PASSTHROUGH.
       xr-mode-ui XRMode:xr offers both buttons; AR is the one that keeps
       the room. hide-on-enter-ar drops the black sky so the passthrough
       feed shows through behind the butterflies, and A-Frame clears to
       transparent in an immersive-ar session by itself. The sky is white
       rather than black so the void reads as light on a desktop and the
       flat colours sit the same way in both modes.
       ar-hit-test is ON by default in A-Frame and puts a placement
       reticle on the floor that this piece has no use for.
       hand-tracking is asked for explicitly rather than left to the
       browser to infer from the hand entities. -->
  <a-scene renderer="antialias: true; colorManagement: true; alpha: true"
           xr-mode-ui="XRMode: xr"
           webxr="optionalFeatures: hand-tracking, local-floor, hit-test"
           ar-hit-test="enabled: false"
           device-orientation-permission-ui="enabled: false">
    <a-sky color="#ffffff" hide-on-enter-ar></a-sky>

    <a-entity butterfly-keyboard></a-entity>
    <!-- v7: the butterflies born out of accepted names. Its own entity,
         and its own root group, because these are not keys -- they are
         never pickable and they have to SURVIVE keyboard.js:reset(),
         which wipes everything about the current visitor 3.2 s after
         they accept. -->
    <a-entity born-butterflies></a-entity>
    <a-entity pointer-input></a-entity>

    <a-entity camera look-controls position="0 1.6 0"></a-entity>

    <!-- modelStyle:dots avoids fetching the hand GLTF; hand-rig hides the
         model outright and publishes the joint data (see js/hands.js) -->
    <a-entity id="handL" hand-tracking-controls="hand: left; modelStyle: dots" hand-rig></a-entity>
    <a-entity id="handR" hand-tracking-controls="hand: right; modelStyle: dots" hand-rig></a-entity>
  </a-scene>
</body>
</html>
